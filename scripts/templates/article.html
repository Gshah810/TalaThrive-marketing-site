<!DOCTYPE html>
<html lang="en">
<head>
<!-- cf-slot: seo-metadata -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cf-generated-article" content="true">
<title>{{title}} | Tala Thrive</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}} | Tala Thrive">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
{{image_metadata_html}}
<link rel="icon" href="../../assets/img/logo-mark.png">
<link rel="stylesheet" href="../../assets/css/site.css?v=7">
<script defer src="../../assets/js/analytics.js?v=5"></script>
<script>try{if(localStorage.getItem('tt_banner_closed')==='1')document.documentElement.classList.add('tt-banner-hidden')}catch(e){}</script>
{{structured_data_html}}
<meta name="mlai-artifact-digest" content="f5d91c6db8f1944a476481fe1e5a857875fafe5d3a5987fc0948697f56bbeca1" /></head>
<body>
{{chrome_html}}
<article>
  <header class="article-head">
    <div class="container container--xs">
      <a class="back-link" href="../../stories/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> All stories</a>
      <div class="story-meta" style="margin-bottom:16px">
        <span class="tag tag--white">{{category}}</span>
        <span class="story-date">{{date}}</span>
      </div>
      <h1>{{title}}</h1>
      <p class="story-date" data-author-slug="{{author_slug}}">By {{author}}</p>
    </div>
  </header>
  {{image_html}}
  <div class="article-body">
{{article_html}}
  </div>
</article>
{{footer_html}}
</body>
</html>
