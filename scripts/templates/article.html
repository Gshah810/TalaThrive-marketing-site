<!DOCTYPE html>
<!-- cf-slot: seo-metadata -->
<!-- cf-generated-detail: {{slug}} -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Tala Thrive</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}} | Tala Thrive">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical}}">
{{image_metadata}}
<link rel="icon" href="../../assets/img/logo-mark.png">
<link rel="stylesheet" href="../../assets/css/site.css?v=7">
<link rel="stylesheet" href="../../assets/css/cf-stories.css">
<script defer src="../../assets/js/analytics.js?v=5"></script>
<script>try{if(localStorage.getItem('tt_banner_closed')==='1')document.documentElement.classList.add('tt-banner-hidden')}catch(e){}</script>
{{structured_data_html}}
<meta name="mlai-artifact-digest" content="7fcec08b6fe80e9739ee626443c2a2e5b6b921db84badb1a95b79cff9bef1dbd" /></head>
<body>
{{chrome}}
<main>
<article>
<section class="article-head">
<div class="container container--xs">
<a class="back-link" href="/stories/">← All stories</a>
<p class="cf-detail-category"><a class="tag" href="{{category_url}}">{{category_label}}</a></p>
<h1>{{title}}</h1>
{{intro}}
<div class="byline cf-detail-byline" data-author-slug="{{author_slug}}"><div><p>By {{author}}</p><p><time datetime="{{date}}">{{display_date}}</time></p></div></div>
</div>
</section>
{{lead_media}}
<div class="article-body">
{{article_html}}
</div>
</article>
</main>
{{footer_and_scripts}}
</body>
</html>
